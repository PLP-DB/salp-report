<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานชั้นเรียนออทิสติก พล.ป.</title>
    <link rel="icon" type="image/png" href="./favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    
    <style>
        /* รีเซ็ตค่าขอบหน้าจอของ GitHub ให้เป็น 0 ทั้งหมด */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* บังคับไม่ให้หน้าจอหลักมีแถบเลื่อน */
            background-color: #ffffff;
        }
        
        /* ตั้งค่า iframe ให้ยืดเต็มพื้นที่แบบ Absolute */
        .gas-iframe {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- เปลี่ยนมาใช้ Class แทนการเขียน Style ในแท็กโดยตรง -->
    <iframe class="gas-iframe" src="https://script.google.com/macros/s/AKfycbyCGQIzctGKTLJKKAzE3UGZQ9NJ96Amh7rsEXjwUC-GnJGxzZraCBijJYjIOjKByjhvEA/exec" allowfullscreen></iframe>

</body>
</html>
